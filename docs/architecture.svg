<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="770" viewBox="0 0 1060 770" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#343a40"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#868e96"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="40" font-size="22" font-weight="700" fill="#212529">go-ov — Component Architecture</text>

  <!-- Legend -->
  <g transform="translate(770,66)">
    <rect x="0" y="0" width="260" height="128" rx="8" fill="#ffffff" stroke="#ced4da"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#212529">Legend</text>
    <rect x="14" y="36" width="20" height="14" rx="3" fill="#cfe2ff" stroke="#0d6efd"/>
    <text x="42" y="48" font-size="12" fill="#212529">In scope (this project)</text>
    <rect x="14" y="58" width="20" height="14" rx="3" fill="#e9ecef" stroke="#6c757d"/>
    <text x="42" y="70" font-size="12" fill="#212529">Out of scope (other parties)</text>
    <rect x="14" y="80" width="20" height="14" rx="3" fill="#fff3cd" stroke="#f0ad4e"/>
    <text x="42" y="92" font-size="12" fill="#212529">Storage (per-user cache)</text>
    <text x="14" y="116" font-size="11" fill="#495057">All components run at ring 3 (user); no elevation.</text>
  </g>

  <!-- Host process container -->
  <rect x="150" y="92" width="330" height="205" rx="10" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="165" y="112" font-size="12" font-weight="700" fill="#6c757d">Host process — ring 3 (user)</text>

  <!-- Host App (out) -->
  <rect x="180" y="124" width="270" height="62" rx="8" fill="#e9ecef" stroke="#6c757d" stroke-width="1.5"/>
  <text x="315" y="150" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Host Go Application</text>
  <text x="315" y="170" font-size="11" fill="#495057" text-anchor="middle">(integrator-delivered)</text>

  <!-- go-ov (in) -->
  <rect x="180" y="226" width="270" height="62" rx="8" fill="#cfe2ff" stroke="#0d6efd" stroke-width="1.5"/>
  <text x="315" y="252" font-size="14" font-weight="700" fill="#0b4fb0" text-anchor="middle">go-ov library</text>
  <text x="315" y="272" font-size="11" fill="#495057" text-anchor="middle">embeddable Go package</text>

  <!-- Host App -> go-ov -->
  <line x1="315" y1="186" x2="315" y2="226" stroke="#343a40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="211" font-size="11" fill="#343a40">library API — in-process Go calls</text>

  <!-- Cache (storage) -->
  <rect x="560" y="226" width="330" height="62" rx="8" fill="#fff3cd" stroke="#f0ad4e" stroke-width="1.5"/>
  <text x="725" y="250" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Per-user cache</text>
  <text x="725" y="270" font-size="11" fill="#495057" text-anchor="middle">%LocalAppData%\intel\goov\&lt;version&gt;</text>

  <!-- go-ov -> cache -->
  <line x1="450" y1="252" x2="560" y2="252" stroke="#343a40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="243" font-size="11" fill="#343a40">file staging (worker + DLLs)</text>

  <!-- Worker process container -->
  <rect x="150" y="330" width="330" height="205" rx="10" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="165" y="350" font-size="12" font-weight="700" fill="#6c757d">Worker process — ring 3 (inherits host token)</text>

  <!-- ov_worker (in) -->
  <rect x="180" y="362" width="270" height="58" rx="8" fill="#cfe2ff" stroke="#0d6efd" stroke-width="1.5"/>
  <text x="315" y="388" font-size="14" font-weight="700" fill="#0b4fb0" text-anchor="middle">ov_worker.exe</text>
  <text x="315" y="407" font-size="11" fill="#495057" text-anchor="middle">native MSVC inference host</text>

  <!-- OpenVINO (out) -->
  <rect x="180" y="456" width="270" height="58" rx="8" fill="#e9ecef" stroke="#6c757d" stroke-width="1.5"/>
  <text x="315" y="482" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">OpenVINO GenAI runtime (DLLs)</text>
  <text x="315" y="501" font-size="11" fill="#495057" text-anchor="middle">3rd-party, bundled</text>

  <!-- go-ov -> worker (crosses boundary) -->
  <line x1="315" y1="288" x2="315" y2="362" stroke="#343a40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="312" width="330" height="18" fill="#ffffff" opacity="0"/>
  <text x="325" y="320" font-size="11" fill="#343a40">spawn + stdio IPC (stdin/stdout pipes)</text>

  <!-- cache -> worker (dotted load) -->
  <path d="M560,270 C500,300 470,330 452,374" fill="none" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowDash)"/>
  <text x="470" y="316" font-size="11" fill="#868e96">worker + DLLs loaded from here</text>

  <!-- worker -> openvino -->
  <line x1="315" y1="420" x2="315" y2="456" stroke="#343a40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="442" font-size="11" fill="#343a40">dynamic link (in-process)</text>

  <!-- Model files (out) -->
  <rect x="120" y="600" width="230" height="62" rx="8" fill="#e9ecef" stroke="#6c757d" stroke-width="1.5"/>
  <text x="235" y="626" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Model files</text>
  <text x="235" y="646" font-size="11" fill="#495057" text-anchor="middle">(integrator-supplied)</text>

  <!-- Intel HW (out) -->
  <rect x="410" y="600" width="260" height="62" rx="8" fill="#e9ecef" stroke="#6c757d" stroke-width="1.5"/>
  <text x="540" y="626" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Intel CPU / GPU / NPU</text>
  <text x="540" y="646" font-size="11" fill="#495057" text-anchor="middle">via OpenVINO device plugins</text>

  <!-- openvino -> model -->
  <path d="M270,514 C250,550 245,570 237,600" fill="none" stroke="#343a40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="556" font-size="11" fill="#343a40">file read</text>

  <!-- openvino -> hw -->
  <path d="M360,514 C420,550 480,568 528,600" fill="none" stroke="#343a40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="556" font-size="11" fill="#343a40">device plugin / driver calls</text>
</svg>
